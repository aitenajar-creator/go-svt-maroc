<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#21633f"><title>المهمة | GO SVT Maroc</title><link rel="stylesheet" href="styles.css">
<style>
body{margin:0;background:#f2f7f3}.task-view{max-width:1200px;margin:auto;padding:18px}.task-view-head{background:linear-gradient(130deg,#16452f,#2b7850);color:#fff;padding:20px;border-radius:18px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.task-view-head h1{font-size:1.3rem;margin:0}.task-view-head a{background:#fff;color:#21633f;text-decoration:none;border-radius:12px;padding:11px 15px;font-weight:800}.task-view-head a:focus-visible{outline:3px solid #f6c84a;outline-offset:3px}.task-frame-wrap{position:relative;margin-top:16px}.task-frame{display:block;width:100%;height:calc(100svh - 145px);min-height:560px;border:1px solid #d7e4da;border-radius:18px;background:white}.task-status{padding:12px 16px;margin:0 0 10px;border-radius:12px;background:#e7f2e9;color:#245b39;font-weight:700}.task-status[hidden]{display:none}
@media(max-width:640px){.task-view{padding:10px}.task-view-head{padding:15px;border-radius:14px}.task-view-head h1{font-size:1.05rem}.task-view-head a{padding:10px 12px;font-size:.92rem}.task-frame{min-height:540px;height:calc(100svh - 125px);border-radius:12px}}
</style></head><body><main class="task-view"><header class="task-view-head"><h1 id="task-title">المهمة العلمية</h1><a id="back-link" href="student-task-categories.html">← العودة إلى التصنيف</a></header><div class="task-frame-wrap"><p id="task-status" class="task-status" role="status" aria-live="polite">جارٍ تحميل المهمة...</p><iframe id="task-frame" class="task-frame" title="المهمة المختارة" loading="eager"></iframe></div></main>
<script>
const p=new URLSearchParams(location.search),category=p.get('category')||'learning',task=p.get('task')||'';
const titles={cell:'استكشف الخلية',photosynthesis:'مختبر التركيب الضوئي',quiz:'اختبر فهمك للخلية والتركيب الضوئي',human:'أطلس أجهزة جسم الإنسان',paths:'مسارات التعلم حسب المستوى',microscope:'المختبر المجهري','photo-experiment':'تجربة التركيب الضوئي','scientific-media':'مكتبة الصور العلمية',memory:'بطاقات الذاكرة العلمية',glossary:'قاموس مصطلحات علوم الحياة والأرض','personal-path':'مساري الدراسي',daily:'تحدي اليوم',recommendations:'توصيات التعلم',activity:'ملخص نشاطك الدراسي','quick-access':'الوصول السريع إلى الموارد'};
const title=titles[task]||'المهمة العلمية';
document.getElementById('task-title').textContent=title;
document.getElementById('task-frame').title=title;
document.getElementById('back-link').href='student-task-categories.html?category='+encodeURIComponent(category);
const frame=document.getElementById('task-frame'),status=document.getElementById('task-status');
frame.addEventListener('load',()=>{status.hidden=true;});
frame.addEventListener('error',()=>{status.textContent='تعذر تحميل المهمة. تحقق من اتصالك بالإنترنت ثم أعد تحميل الصفحة.';});
frame.src='index.html?studentCategory='+encodeURIComponent(category)+'&studentTask='+encodeURIComponent(task)+'#student-space';
</script></body></html>

</style></head><body><main class="resource-category-page"><header class="resource-category-head"><h1 id="category-title">المكتبة المصنفة</h1><a href="teacher-community.html#resource-categories">← العودة إلى تصنيفات المجتمع</a></header><iframe id="category-frame" class="resource-category-frame" title="الموارد الخاصة بهذا التصنيف" loading="eager"></iframe></main><script>

# Keep tooling, test data, local settings and database source out of the public artifact.
exclude:
  - node_modules
  - design-upgrade-v2
  - tests
  - test-runner.html
  - AUDIT_TEST_SUITE.js
  - test-results
  - playwright-report
  - scripts
  - supabase
  - package.json
  - package-lock.json
  - playwright.config.cjs
  - config.local.json
  - config.local.example.json

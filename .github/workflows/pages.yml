name: Déploiement Go SVT Maroc

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 9 * * *"      # 09:30 UTC = après la réinitialisation quotidienne des quotas Google (minuit, heure du Pacifique) : termine les quiz restants. Supprimez ces 2 lignes si inutile.
  workflow_dispatch:
    inputs:
      quiz_filter:
        description: "Quiz : ne traiter que les cours dont le chemin contient ce texte (ex. U1C1). Vide = tous les cours sans quiz."
        required: false
        default: ""
      quiz_force:
        description: "Quiz : régénérer aussi les quiz automatiques déjà existants (true/false)"
        required: false
        default: "false"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Quality gate
    uses: ./.github/workflows/validate-site.yml

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/configure-pages@v5

      # 1) Quiz automatiques : un quiz est créé pour chaque nouveau cours PDF (ne bloque jamais le déploiement)
      - name: Générer les quiz des nouveaux cours (IA Gemini gratuit ou Claude)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 60
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          QUIZ_PROVIDER: ${{ vars.QUIZ_PROVIDER }}
          QUIZ_PACE: ${{ vars.QUIZ_PACE }}
          QUIZ_MODEL: ${{ vars.QUIZ_MODEL }}
          QUIZ_MODELS: ${{ vars.QUIZ_MODELS }}
          QUIZ_MAX_NEW: ${{ vars.QUIZ_MAX_NEW }}
          QUIZ_VERIFY: ${{ vars.QUIZ_VERIFY }}
          QUIZ_FILTER: ${{ inputs.quiz_filter }}
          QUIZ_FORCE: ${{ inputs.quiz_force }}
        run: python3 _tools/generate_quiz.py
      # 2) Pages SEO, sitemap, liens dans index.html
      - name: Générer les pages SEO (svt/, sitemap.xml, liens index.html)
        env:
          QUIZ_PAGES_NOINDEX_AUTO: ${{ vars.QUIZ_PAGES_NOINDEX_AUTO }}
        run: python3 _tools/build_seo.py
      - name: Build verified Wikimedia Commons science image catalogue
        run: python3 _tools/build_science_media.py
      - name: Build factual student learning catalog
        run: python3 _tools/build_student_catalog.py
      - name: Validate student catalog source files
        run: python3 scripts/check-student-catalog.py
      - name: Build Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      # The Pages Jekyll action omits this public root-level runtime config from _site.
      - name: Include public Supabase browser configuration
        run: sudo cp supabase-config.js _site/supabase-config.js
      - name: Dates des fichiers
        run: |
          python3 - <<'PYEOF'
          import json, subprocess
          log = subprocess.run(
              ["git", "-c", "core.quotepath=off", "log", "--diff-filter=A", "--format=@%ct", "--name-only"],
              capture_output=True, encoding="utf-8", check=True).stdout
          dates, ts = {}, 0
          for line in log.splitlines():
              if line.startswith("@"):
                  ts = int(line[1:])
              elif line.strip():
                  dates.setdefault("/" + line.strip(), ts)
          with open("dates.json", "w", encoding="utf-8") as f:
              json.dump(dates, f, ensure_ascii=False)
          PYEOF
          sudo cp dates.json _site/dates.json
      - name: Stamp release-scoped offline caches
        run: sudo python3 _tools/build_service_worker.py _site
      - name: Validate the exact artifact before upload
        run: python3 scripts/check-site.py _site --built
      - name: Validate student catalog in built Pages artifact
        run: python3 scripts/check-student-catalog.py --root _site
      # Persist generated quizzes only AFTER validating the artifact. Never pull/rebase
      # here: a concurrent update to main must not change the checkout being deployed.
      - name: Enregistrer les quiz validés sans modifier la révision construite
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quiz quiz-map.json
          if ! git diff --cached --quiet; then
            git commit -m "Quiz générés automatiquement"
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000

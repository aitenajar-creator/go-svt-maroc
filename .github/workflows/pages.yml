name: Déploiement Go SVT Maroc

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 9 * * *"      # 09:30 UTC = après la réinitialisation quotidienne des quotas Google (minuit, heure du Pacifique) : termine les quiz restants. Supprimez ces 2 lignes si inutile.
  workflow_dispatch:
    inputs:
      quiz_filter:
        description: "Quiz : ne traiter que les cours dont le chemin contient ce texte (ex. U1C1). Vide = tous les cours sans quiz."
        required: false
        default: ""
      quiz_force:
        description: "Quiz : régénérer aussi les quiz automatiques déjà existants (true/false)"
        required: false
        default: "false"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/configure-pages@v5

      # 1) Quiz automatiques : un quiz est créé pour chaque nouveau cours PDF (ne bloque jamais le déploiement)
      - name: Générer les quiz des nouveaux cours (IA Gemini gratuit ou Claude)
        continue-on-error: true
        timeout-minutes: 60
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          QUIZ_PROVIDER: ${{ vars.QUIZ_PROVIDER }}
          QUIZ_PACE: ${{ vars.QUIZ_PACE }}
          QUIZ_MODEL: ${{ vars.QUIZ_MODEL }}
          QUIZ_MODELS: ${{ vars.QUIZ_MODELS }}
          QUIZ_MAX_NEW: ${{ vars.QUIZ_MAX_NEW }}
          QUIZ_VERIFY: ${{ vars.QUIZ_VERIFY }}
          QUIZ_FILTER: ${{ inputs.quiz_filter }}
          QUIZ_FORCE: ${{ inputs.quiz_force }}
        run: python3 _tools/generate_quiz.py
      - name: Enregistrer les quiz générés dans le dépôt
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quiz quiz-map.json
          if git diff --cached --quiet; then
            echo "Aucun nouveau quiz à enregistrer"
          else
            git commit -m "Quiz générés automatiquement"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break || sleep 5
            done
          fi

      # 2) Pages SEO, sitemap, liens dans index.html
      - name: Générer les pages SEO (svt/, sitemap.xml, liens index.html)
        env:
          QUIZ_PAGES_NOINDEX_AUTO: ${{ vars.QUIZ_PAGES_NOINDEX_AUTO }}
        run: python3 _tools/build_seo.py
      - name: Build Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Dates des fichiers
        run: |
          python3 - <<'PYEOF'
          import json, subprocess
          log = subprocess.run(
              ["git", "-c", "core.quotepath=off", "log", "--diff-filter=A", "--format=@%ct", "--name-only"],
              capture_output=True, encoding="utf-8", check=True).stdout
          dates, ts = {}, 0
          for line in log.splitlines():
              if line.startswith("@"):
                  ts = int(line[1:])
              elif line.strip():
                  dates.setdefault("/" + line.strip(), ts)
          with open("dates.json", "w", encoding="utf-8") as f:
              json.dump(dates, f, ensure_ascii=False)
          PYEOF
          sudo cp dates.json _site/dates.json
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

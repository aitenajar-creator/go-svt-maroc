name: Validate site assets

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: JavaScript, JSON and page references
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          git ls-files -z -- '*.js' | xargs -0 -r -n1 node --check

      - name: Validate JSON files
        run: |
          git ls-files -z -- '*.json' | python3 -c '
          import json, pathlib, sys
          paths = [p.decode() for p in sys.stdin.buffer.read().split(b"\\0") if p]
          for name in paths:
              with pathlib.Path(name).open(encoding="utf-8") as f:
                  json.load(f)
              print("Valid JSON:", name)
          '

      - name: Verify local scripts and styles referenced by index.html
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class AssetParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.assets = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "script" and attrs.get("src"):
                      self.assets.append(("script", attrs["src"]))
                  elif tag == "link" and "stylesheet" in attrs.get("rel", "").split() and attrs.get("href"):
                      self.assets.append(("stylesheet", attrs["href"]))

          parser = AssetParser()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          missing = []
          for kind, url in parser.assets:
              if url.startswith(("https://", "http://", "//", "data:")):
                  continue
              local = url.split("?", 1)[0].split("#", 1)[0].lstrip("/")
              if local and not Path(local).is_file():
                  missing.append(f"{kind}: {url}")
          if missing:
              raise SystemExit("Missing local assets:\\n" + "\\n".join(missing))
          print(f"Verified {len(parser.assets)} local script/style references.")
          ordered = [url for kind, url in parser.assets if kind == "script"]
          for before, after in [("student-space.js", "student-account.js"), ("student-account.js", "student-space-continue.js")]:
              if before in ordered and after in ordered and ordered.index(before) >= ordered.index(after):
                  raise SystemExit(f"Script load order invalid: {before} must precede {after}")
          PY

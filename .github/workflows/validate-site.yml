name: Validate site assets

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Source, behavior, database fixtures and browser checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked test dependencies
        run: npm ci --ignore-scripts

      - name: Check source JSON, JavaScript, inline scripts, assets and load order
        run: python3 scripts/check-site.py

      - name: Verify RLS coverage in database migrations
        run: python3 scripts/check-migration-rls.py

      - name: Verify SEO metadata and private-page indexing
        run: python3 scripts/check-seo-indexing.py

      - name: Verify teacher community security policies
        run: python3 scripts/check-teacher-community-security.py

      - name: Verify basic accessibility in static HTML
        run: python3 scripts/check-basic-accessibility.py

      - name: Check migration project assignments
        run: python3 scripts/migration-plan.py --check

      - name: Run behavioral and isolated PostgreSQL regression tests
        run: npm test

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run browser regression tests with mocked services
        run: npm run test:browser

      # Build the same static artifact that Pages will publish. Source checks alone
      # cannot catch Liquid/Jekyll failures or broken generated asset references.
      - name: Generate SEO pages
        run: python3 _tools/build_seo.py

      - name: Build science media catalogue
        run: python3 _tools/build_science_media.py

      - name: Build GitHub Pages artifact
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Add deployment dates metadata
        run: |
          python3 - <<'PY'
          import json, subprocess
          log = subprocess.run(
              ["git", "-c", "core.quotepath=off", "log", "--diff-filter=A", "--format=@%ct", "--name-only"],
              capture_output=True, encoding="utf-8", check=True).stdout
          dates, timestamp = {}, 0
          for line in log.splitlines():
              if line.startswith("@"):
                  timestamp = int(line[1:])
              elif line.strip():
                  dates.setdefault("/" + line.strip(), timestamp)
          with open("dates.json", "w", encoding="utf-8") as output:
              json.dump(dates, output, ensure_ascii=False)
          PY
          cp dates.json _site/dates.json

      - name: Stamp release-scoped offline caches
        run: python3 _tools/build_service_worker.py _site

      - name: Validate the exact Pages artifact
        run: python3 scripts/check-site.py _site --built

name: Validate site assets

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Source, behavior, database fixtures and browser checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked test dependencies
        run: npm ci --ignore-scripts

      - name: Check source JSON, JavaScript, inline scripts, assets and load order
        run: python3 scripts/check-site.py

      - name: Verify RLS coverage in database migrations
        run: python3 scripts/check-migration-rls.py

      - name: Verify SEO metadata and private-page indexing
        run: python3 scripts/check-seo-indexing.py

      - name: Verify teacher community security policies
        run: python3 scripts/check-teacher-community-security.py

      - name: Verify basic accessibility in static HTML
        run: python3 scripts/check-basic-accessibility.py

      - name: Check migration project assignments
        run: python3 scripts/migration-plan.py --check

      - name: Run behavioral and isolated PostgreSQL regression tests
        run: npm test

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run browser regression tests with mocked services
        run: npm run test:browser

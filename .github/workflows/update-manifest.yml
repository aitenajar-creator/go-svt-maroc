name: Update content manifest

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'manifest.json'
      - 'sitemap.xml'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-content-manifest-main
  cancel-in-progress: false

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Regenerate manifest from the latest main and push safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Manifest update attempt $attempt"
            git fetch origin main
            git reset --hard origin/main

            python3 << 'PYEOF'
          import os, json, datetime

          CONTENT_DIRS = ["cours", "exercices", "examens", "fiches", "documents", "ressources", "divers"]
          SKIP = {"readme.md", "thumbs.db", "desktop.ini"}
          tree = {}
          pdf_paths = []

          for base in CONTENT_DIRS:
              if not os.path.isdir(base):
                  continue
              for root, dirs, files in os.walk(base):
                  dirs[:] = sorted(d for d in dirs if not d.startswith("."))
                  clean = sorted(
                      f for f in files
                      if not f.startswith(".") and f.lower() not in SKIP
                  )
                  if not clean:
                      continue
                  rel = root.replace(os.sep, "/")
                  node = tree
                  for part in rel.split("/"):
                      node = node.setdefault(part, {})
                  node["__files"] = clean

          manifest = {
              "generated": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "tree": tree,
          }

          with open("manifest.json", "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, ensure_ascii=False, indent=2)

          print("manifest.json OK -", len(tree), "sections:", ", ".join(tree.keys()))

          from urllib.parse import quote
          from xml.sax.saxutils import escape

          urls = ["https://gosvtmaroc.com/"]
          urls.extend("https://gosvtmaroc.com/" + quote(path, safe="/") for path in sorted(pdf_paths))
          sitemap = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
          ]
          for url in urls:
              sitemap.extend(["  <url>", f"    <loc>{escape(url)}</loc>", "  </url>"])
          sitemap.append("</urlset>")
          with open("sitemap.xml", "w", encoding="utf-8") as fh:
              fh.write("\\n".join(sitemap) + "\\n")
          print("sitemap.xml OK -", len(urls), "URLs including homepage")
          PYEOF

            git add manifest.json sitemap.xml
            if git diff --cached --quiet; then
              echo "Manifest unchanged - nothing to commit"
              exit 0
            fi

            git commit -m "Auto-update manifest.json"
            if git push origin HEAD:main; then
              echo "Manifest pushed successfully"
              exit 0
            fi

            echo "Push attempt $attempt failed; retrying from latest main..."
            sleep 2
          done

          echo "Unable to push manifest after 3 attempts."
          exit 1
